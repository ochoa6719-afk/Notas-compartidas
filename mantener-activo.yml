# Evita que Supabase pause el proyecto gratis por inactividad.
# Cada día hace unas consultas pequeñas a la base de datos (no escribe ni cambia nada).
name: Mantener Supabase activo

on:
  schedule:
    - cron: '0 14 * * *'   # todos los días a las 14:00 UTC (9:00 a. m. Ecuador)
  workflow_dispatch:        # permite ejecutarlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar Supabase
        run: |
          URL=$(grep -oP "SUPABASE_URL\s*=\s*'\K[^']+" js/config.js)
          KEY=$(grep -oP "SUPABASE_KEY\s*=\s*'\K[^']+" js/config.js)
          for t in profiles notes profiles; do
            curl -fsS -o /dev/null -w "$t -> HTTP %{http_code}\n" "$URL/rest/v1/$t?select=id&limit=1" -H "apikey: $KEY"
          done
